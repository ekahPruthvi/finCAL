[package]
name = "fincal"
version = "0.1.0"
edition = "2021"
authors = ["ekahPruthvi <ekahpdp@gmail.com>"]
description = "Personal finance journal integrated with logseq pages"
license = "GPL-3.0"
repository = "https://github.com/ekahPruthvi/finCAL.git"

[[bin]]
name = "finCAL"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
